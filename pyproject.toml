[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-osint"
version = "1.0.0"
description = "Agentic recursive OSINT research system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "David Moore", email = "david@datamathcode.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "websockets==12.0",
    "sqlalchemy>=2.0.23,<2.1",
    "alembic==1.12.1",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "mdformat>=0.7.0",
    "bandit>=1.7.0",
    "httpx>=0.27,<0.28",
]

[project.scripts]
synint-wrapper = "src.python.agents.synint_wrapper:main"
auto-osint-db = "src.python.scripts.setup_database:main"
migrate-evidence = "src.python.migrations.migrate_evidence_to_confidence:main"

[project.urls]
Homepage = "https://github.com/datamathcode/auto-osint"
Documentation = "https://github.com/datamathcode/auto-osint#readme"

[tool.setuptools.packages.find]
# Source root is the repository root: packages live under src/python.
where = ["."]
include = ["src*"]
exclude = ["src.python.auto-osint*"]
namespaces = true

[tool.setuptools.package-data]
# Ship the playbook MDX inside the wheel; a missing file silently degrades
# load() to the built-in defaults.
"src.python" = ["*.mdx"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Legacy duplicate tree kept for reference; not an importable package.
extend-exclude = ["src/python/auto-osint"]

[tool.ruff.lint]
# Deliberate, project-level rule set. Keep this list explicit so CI is stable.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F401"]
# FastAPI's dependency injection requires the Depends(...) call as a default.
"src/python/routers/*" = ["B008"]
